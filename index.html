function PageTerrenos({ terrenos, setTerrenos }) {
  const [search, setSearch] = useState("");
  const [filterStatus, setFilterStatus] = useState("");
  const [filterUF, setFilterUF] = useState("");
  const [showForm, setShowForm] = useState(false);
  const [editId, setEditId] = useState(null);
  const [form, setForm] = useState({ nome: "", uf: "MG", cidade: "", areaMq: "", unidadesEstimadas: "", status: "Análise", contato: "", observacoes: "" });

  const filtered = terrenos.filter(t => {
    const s = search.toLowerCase();
    return (!search || t.nome.toLowerCase().includes(s) || t.cidade.toLowerCase().includes(s))
      && (!filterStatus || t.status === filterStatus)
      && (!filterUF || t.uf === filterUF);
  });

  const handleSave = () => {
    if (!form.nome || !form.cidade || !form.areaMq) return;
    if (editId !== null) {
      setTerrenos(prev => prev.map(t => t.id === editId ? { ...t, ...form, unidadesEstimadas: parseInt(form.unidadesEstimadas) || 0 } : t));
      setEditId(null);
    } else {
      const newId = Math.max(...terrenos.map(t => t.id), 0) + 1;
      setTerrenos(prev => [...prev, { ...form, id: newId, unidadesEstimadas: parseInt(form.unidadesEstimadas) || 0 }]);
    }
    setForm({ nome: "", uf: "MG", cidade: "", areaMq: "", unidadesEstimadas: "", status: "Análise", contato: "", observacoes: "" });
    setShowForm(false);
  };

  const handleEdit = (t) => {
    setForm({ ...t, areaMq: t.areaMq.toString(), unidadesEstimadas: t.unidadesEstimadas.toString() });
    setEditId(t.id);
    setShowForm(true);
  };

  // Auto-salva enquanto edita (500ms após parar de digitar)
  useEffect(() => {
    if (editId === null || !form.nome) return;
    const timer = setTimeout(() => {
      setTerrenos(prev => prev.map(t => t.id === editId
        ? { ...t, ...form, unidadesEstimadas: parseInt(form.unidadesEstimadas) || 0 }
        : t
      ));
    }, 500);
    return () => clearTimeout(timer);
  }, [form, editId]);

  const inpCls = "border border-white/15 rounded-lg px-3 py-2 text-sm placeholder:text-white/40 focus:outline-none focus:border-blue-500/60";
  const inpStyle = { background: "#1e2d4a", color: "#ffffff", colorScheme: "dark" };

  return (
    React.createElement('div', { className: "p-6 space-y-5" ,}
      , React.createElement('div', { className: "flex items-center justify-between"  ,}

  { id: "funil",      label: "Funil",      icon: TrendingDown },
  { id: "insights",   label: "Insights",   icon: Lightbulb },
  { id: "relatorios", label: "Relatórios", icon: FileText },
];

function App() {
  const [page, setPage] = useState("dashboard");
  const [sidebarOpen, setSidebarOpen] = useState(true);
  const [terrenos, setTerrenos] = useState(INITIAL_TERRENOS);
  const [storageReady, setStorageReady] = useState(false);
  const [saveStatus, setSaveStatus] = useState(''); // '', 'saving', 'saved', 'error'

  const DB_URL = "https://landbank-amarildo-default-rtdb.firebaseio.com";

  // Carrega dados do Firebase ao iniciar
  useEffect(() => {
    async function load() {
      try {
        const res = await fetch(`${DB_URL}/terrenos.json`);
        if (res.ok) {
          const data = await res.json();
          if (data && typeof data === 'object') {
            const arr = Array.isArray(data)
              ? data.filter(Boolean)
              : Object.values(data).filter(Boolean);
            if (arr.length > 0) setTerrenos(arr);
          }
        }
      } catch (e) {
        console.error('Erro ao carregar:', e);
      }
      setStorageReady(true);
    }
    load();
  }, []);

  const handleManualSave = async () => {
    setSaveStatus('saving');
    try {
      const payload = {};
      terrenos.forEach((t, i) => { payload[i] = t; });
      const res = await fetch(`${DB_URL}/terrenos.json`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      if (res.ok) {
        setSaveStatus('saved');
      } else {
        const txt = await res.text();
        console.error('Firebase error:', res.status, txt);
        setSaveStatus('error');
      }
    } catch (e) {
      console.error('Erro ao salvar:', e);
      setSaveStatus('error');
    }
    setTimeout(() => setSaveStatus(''), 3000);
  };

  const renderPage = () => {
    switch (page) {
      case "dashboard":  return React.createElement(PageDashboard, { terrenos: terrenos,} );
      case "terrenos":   return React.createElement(PageTerrenos, { terrenos: terrenos, setTerrenos: setTerrenos,} );
      case "funil":      return React.createElement(PageFunil, { terrenos: terrenos, setTerrenos: setTerrenos,} );
      case "insights":   return React.createElement(PageInsights, { terrenos: terrenos,} );
      case "relatorios": return React.createElement(PageRelatorios, { terrenos: terrenos,} );
      default:           return React.createElement(PageDashboard, { terrenos: terrenos,} );
    }
  };

  return (
    React.createElement('div', { className: "min-h-screen flex" , style: { background: "linear-gradient(135deg,#060b18 0%,#0a1628 50%,#080e1f 100%)", fontFamily: "system-ui,-apple-system,sans-serif" },}
      /* Sidebar */
      , React.createElement('aside', { className: "flex-shrink-0 flex flex-col transition-all duration-300"    ,
        style: { width: sidebarOpen ? 220 : 64, background: "rgba(255,255,255,0.025)", borderRight: "1px solid rgba(255,255,255,0.07)" },}
        /* Logo */
        , React.createElement('div', { className: "flex items-center justify-between p-4 border-b"    , style: { borderColor: "rgba(255,255,255,0.07)" },}
          , sidebarOpen && (
            React.createElement('div', { className: "flex items-center gap-2"  ,}
              , React.createElement('div', { className: "w-7 h-7 rounded-lg bg-blue-500 flex items-center justify-center"      ,}
                , React.createElement(Building2, { size: 14, className: "text-white",} )
              )
              , React.createElement('span', { className: "text-sm font-bold text-white tracking-wider"   ,}, "LANDBANK")
            )
          )
          , React.createElement('button', { onClick: () => setSidebarOpen(!sidebarOpen),
            className: "p-1.5 rounded-md text-white/30 hover:text-white/60 hover:bg-white/6 transition-colors"     ,}
            , sidebarOpen ? React.createElement(X, { size: 16,} ) : React.createElement(Menu, { size: 16,} )
          )
        )

        /* Nav */
        , React.createElement('nav', { className: "flex-1 p-3 space-y-1"  ,}
          , NAV_ITEMS.map(item => {
            const active = page === item.id;
            return (
              React.createElement('button', { key: item.id, onClick: () => setPage(item.id),
                className: "w-full flex items-center gap-3 px-3 py-2.5 rounded-lg transition-colors text-left"        ,
                style: { background: active ? "rgba(96,165,250,0.15)" : "transparent", color: active ? "#60a5fa" : "rgba(255,255,255,0.4)" },}
                , React.createElement(item.icon, { size: 17, className: "flex-shrink-0",} )
                , sidebarOpen && React.createElement('span', { className: "text-sm font-medium" ,}, item.label)
              )
            );
          })
        )

        /* Footer */
        , React.createElement('div', { className: "p-3 border-t" , style: { borderColor: "rgba(255,255,255,0.07)" },}
          , sidebarOpen && (
            React.createElement('div', { className: "mb-2 px-3" ,}
              , React.createElement('p', { className: "text-xs text-white/20" ,}, "Logado como" )
              , React.createElement('p', { className: "text-xs font-semibold text-white/50 truncate"   ,}, "Amarildo Freitas" )
              , saveStatus === 'saving' && React.createElement('p', { className: "text-xs text-yellow-400/70 mt-1"  ,}, "⟳ Salvando..." )
              , saveStatus === 'saved'  && React.createElement('p', { className: "text-xs text-green-400/70 mt-1"  ,}, "✓ Salvo na nuvem"   )
              , saveStatus === 'error'  && React.createElement('p', { className: "text-xs text-red-400/70 mt-1"  ,}, "✗ Erro ao salvar"   )
            )
          )
          , React.createElement('button', { className: "w-full flex items-center gap-3 px-3 py-2 rounded-lg text-white/25 hover:text-white/50 hover:bg-white/5 transition-colors"          ,}
            , React.createElement(LogOut, { size: 16, className: "flex-shrink-0",} )
            , sidebarOpen && React.createElement('span', { className: "text-sm",}, "Sair")
          )
        )
      )

      /* Main */
      , React.createElement('main', { className: "flex-1 overflow-auto" ,}
        /* Barra de salvar fixo no topo */
        , React.createElement('div', { className: "sticky top-0 z-50 flex items-center justify-end gap-3 px-6 py-2"        ,
          style: {background: "rgba(6,11,24,0.85)", backdropFilter: "blur(8px)", borderBottom: "1px solid rgba(255,255,255,0.06)"},}
          , saveStatus === 'saving' && (
            React.createElement('span', { className: "text-xs text-yellow-400/80 flex items-center gap-1.5"    ,}
              , React.createElement('svg', { className: "animate-spin", width: "12", height: "12", viewBox: "0 0 24 24"   , fill: "none", stroke: "currentColor", strokeWidth: "2",}, React.createElement('path', { d: "M21 12a9 9 0 1 1-6.219-8.56"     ,})), "Salvando..."

            )
          )
          , saveStatus === 'saved' && (
            React.createElement('span', { className: "text-xs text-green-400/80 flex items-center gap-1.5"    ,}
              , React.createElement('svg', { width: "12", height: "12", viewBox: "0 0 24 24"   , fill: "none", stroke: "currentColor", strokeWidth: "2.5",}, React.createElement('polyline', { points: "20 6 9 17 4 12"     ,})), "Salvo na nuvem"

            )
          )
          , saveStatus === 'error' && (
            React.createElement('span', { className: "text-xs text-red-400/80" ,}, "✗ Erro ao salvar"   )
          )
          , React.createElement('button', {
            onClick: handleManualSave,
            disabled: saveStatus === 'saving',
            className: "flex items-center gap-2 px-4 py-1.5 rounded-lg text-sm font-medium transition-all"        ,
            style: {
              background: saveStatus === 'saved' ? 'rgba(52,211,153,0.2)' : 'rgba(96,165,250,0.2)',
              border: saveStatus === 'saved' ? '1px solid rgba(52,211,153,0.4)' : '1px solid rgba(96,165,250,0.4)',
              color: saveStatus === 'saved' ? '#34d399' : '#60a5fa',
              opacity: saveStatus === 'saving' ? 0.6 : 1
            },}
            , React.createElement('svg', { width: "14", height: "14", viewBox: "0 0 24 24"   , fill: "none", stroke: "currentColor", strokeWidth: "2",}
              , React.createElement('path', { d: "M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"                ,})
              , React.createElement('polyline', { points: "17 21 17 13 7 13 7 21"       ,}), React.createElement('polyline', { points: "7 3 7 8 15 8"     ,})
            )
            , saveStatus === 'saving' ? 'Salvando...' : saveStatus === 'saved' ? 'Salvo!' : 'Salvar'
          )
        )
        , renderPage()
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App, null));

  </script>
</body>
</html>
